<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14182b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Varu vs Pisicile" />
    <!-- The orange-cat logo (art-source/logo.png -> scripts/make-icons.py -> public/icons/). -->
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <!-- Installable app + offline play: manifest here, service worker is registered by src/core/pwa.ts (built game only). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Varu vs. Pisicile 🐱🧷</title>
    <style>
      html, body { margin: 0; height: 100%; background: #14182b; overflow: hidden; touch-action: none; }
      /* Phones: the visible height changes with the browser bars, so size the page with the dynamic viewport height where it exists.
         core/viewport.ts then overwrites --app-h with the exact visible height (visualViewport) and tells Phaser to measure again. */
      :root { --app-h: 100%; }
      @supports (height: 100dvh) { :root { --app-h: 100dvh; } }
      /* The game sits inside the safe area (notch, rounded corners, home bar) so nothing is hidden; the navy page color fills the rest. */
      #game { position: absolute; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
      /* In real fullscreen the browser makes #game cover the whole screen (notch and home-bar areas too); keep any gap navy, not black. */
      #game:fullscreen { background: #14182b; }
      canvas { display: block; touch-action: none; }
      /* Fixed body: no pull-to-refresh, no rubber-band scrolling, no grey flash when tapping, no text selection or long-press menu. */
      body { position: fixed; top: 0; left: 0; width: 100%; height: var(--app-h); overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* Phones held upright: ask to turn the phone (the game pauses by itself, see config/pause.ts). */
      #rotate-hint { display: none; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box; text-align: center; background: #14182b; color: #fff3d6; font: 28px/1.3 'Lilita One', Impact, sans-serif; }
      #rotate-hint .turn { font-size: 72px; }
      #rotate-hint .sub { font-size: 18px; opacity: 0.8; max-width: 420px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate-hint { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
<div id="boot-error"><div>Jocul nu a putut porni 😿 Fă o poză cu acest ecran și trimite-o.</div><pre></pre></div>
    <div id="rotate-hint"><div class="turn">&#x1F4F1;&#x21BB;</div><div>Întoarce telefonul pe orizontală ca să joci</div><div class="sub">Nu se rotește? Oprește „Blocare orientare” (iPhone: Centrul de control; Android: setările rapide). Pe Android poți și să atingi ecranul.</div></div>
    <style>
      #boot-error { display: none; position: fixed; inset: 0; z-index: 20; box-sizing: border-box; padding: 20px; overflow: auto; background: #14182b; color: #fff3d6; font: 16px/1.4 system-ui, sans-serif; user-select: text; -webkit-user-select: text; }
      #boot-error pre { white-space: pre-wrap; word-break: break-word; font-size: 13px; color: #f5c518; }
    </style>
    <script>
      /* If the game cannot start (old browser, blocked file, no WebGL) show WHY instead of a blank page. Only before the game is ready. */
      (function () {
        function show(msg) {
          if (window.__varuReady) return;
          var box = document.getElementById('boot-error');
          if (!box) return;
          box.style.display = 'block';
          box.querySelector('pre').textContent += msg + '\n';
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window) { if (t.tagName === 'SCRIPT') show('Nu s-a putut incarca: ' + (t.src || '')); return; }
          show((e.message || 'Eroare') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        }, true);
        window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + ((e.reason && e.reason.message) || e.reason)); });
        setTimeout(function () { show('Jocul nu a pornit in 15 secunde. Browser: ' + navigator.userAgent); }, 15000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
